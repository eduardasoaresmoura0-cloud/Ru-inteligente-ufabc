<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RU Inteligente — UFABC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <style>
        /* =========================================================
        CONFIGURAÇÕES GERAIS
        ========================================================= */
        :root {
            --verde: #005137;
            --verde-claro: #0b8457;
            --verde-suave: #eaf5f0;
            --ambar: #e8930c;
            --vermelho: #c0392b;
            --fundo: #ffffff;
            --fundo-suave: #f7f9f8;
            --texto: #17251f;
            --texto-suave: #66756e;
            --borda: #e4e9e6;
            --sombra: 0 8px 25px rgba(0, 40, 25, 0.06);
            --raio: 18px;
            --status-color: var(--verde-claro);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--fundo); color: var(--texto); min-height: 100vh; }

        /* =========================================================
        HEADER
        ========================================================= */
        .header { width: 100%; border-bottom: 1px solid var(--borda); background: #fff; padding: 18px 5%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-title h1 { color: var(--verde); font-size: 1.25rem; font-weight: 700; }
        .header-title p { color: var(--texto-suave); font-size: 0.75rem; margin-top: 2px; }
        .header-right { display: flex; align-items: center; gap: 28px; }
        .clock { text-align: right; }
        .clock-time { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: var(--texto); }
        .clock-date { font-size: 0.7rem; color: var(--texto-suave); }
        .live-indicator { display: flex; align-items: center; gap: 7px; font-size: 0.75rem; font-weight: 600; color: var(--texto-suave); }
        .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #aab4af; }
        .live-indicator.online { color: var(--verde-claro); }
        .live-indicator.online .live-dot { background: var(--verde-claro); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(11,132,87,0.4); } 70% { box-shadow: 0 0 0 7px rgba(11,132,87,0); } 100% { box-shadow: 0 0 0 0 rgba(11,132,87,0); } }
        
        /* Logo Glow */
        .logo-container img { height: 42px; max-width: 120px; object-fit: contain; }
        .logo-glow { filter: drop-shadow(0 0 8px rgba(0, 163, 224, 0.6)); transition: filter 0.3s ease; }
        .logo-glow:hover { filter: drop-shadow(0 0 15px rgba(0, 163, 224, 0.9)); }

        /* =========================================================
        CONTAINER PRINCIPAL
        ========================================================= */
        .main-container { width: min(1400px, 92%); margin: auto; padding: 30px 0 45px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); padding: 25px; }
        
        .footer { text-align: center; font-size: 0.68rem; color: #a4afa9; padding-top: 10px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="header-title">
                <h1>RU Inteligente</h1>
                <p>Restaurante Universitário • UFABC</p>
            </div>
        </div>
        <div class="header-right">
            <div class="live-indicator" id="liveIndicator">
                <span class="live-dot"></span>
                <span id="liveText">Conectando...</span>
            </div>
            <div class="clock">
                <div class="clock-time" id="clockTime">--:--</div>
                <div class="clock-date" id="clockDate">--</div>
            </div>
            <div class="logo-container">
                <img src="logo-ufabc.png" alt="Logo UFABC" class="logo-glow" onerror="this.style.display='none';">
            </div>
        </div>
    </header>
    <main class="main-container">
        <!-- Conteúdo do projeto... -->
    </main>
    <footer class="footer">
        Projeto IoT — RU Inteligente — UFABC • 2026
    </footer>
</body>
</html>
